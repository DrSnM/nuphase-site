name: Refresh citation counts

on:
  schedule:
    - cron: "17 19 * * *"   # daily, 19:17 UTC (early morning in Adelaide)
  workflow_dispatch:         # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch counts from Google Scholar
        # Google often blocks cloud servers; if so this step fails harmlessly and the
        # site keeps its last numbers (the page shows when they were last updated).
        continue-on-error: true
        run: python scripts/update_citations.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- data/citations.json; then
            git config user.name "citations-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/citations.json
            git commit -m "Update citation counts"
            git push
          fi
